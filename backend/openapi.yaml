openapi: 3.0.3
info:
  title: Yercaud Business Directory API
  version: 0.1.0
  description: >
    Backend contract for the public frontend and Admin panel. Auth is
    httpOnly session cookies (ADR: session cookies over JWT). See
    /CONTEXT.md and /docs/adr/ for the domain model and design decisions
    this contract implements.
servers:
  - url: http://localhost:4000/v1
    description: Local dev

security:
  - cookieAuth: []

tags:
  - name: Auth
  - name: Taxonomies
  - name: Businesses
  - name: Listings
  - name: Search
  - name: Reviews
  - name: Favorites
  - name: Enquiries
  - name: Admin
  - name: Marketing
  - name: Featured
  - name: Blog
  - name: FAQ
  - name: Content

paths:
  # ===========================================================================
  # Auth
  # ===========================================================================
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create a User account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201':
          description: Account created, session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    patch:
      tags: [Auth]
      summary: Update the current User's own profile
      description: >-
        Added in Phase 10 — nothing let a User edit their own profile.
        PATCH /users/{userId} is the Super Admin's suspend/reactivate, and /me/*
        was read-only.

        Self-scoped by construction: it acts on the session's User, so there is no
        id in the path to tamper with. Email is deliberately not editable — it's
        the login identity and the unique key, so changing it is an
        account-recovery flow, not a profile edit. Password has its own reset
        flow. Roles and status are not self-editable, and are stripped from the
        body rather than honoured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnProfileInput' }
      responses:
        '200':
          description: OK — the same shape as /auth/me, so a client can swap it straight into its cache.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/username-available:
    get:
      tags: [Auth]
      summary: Live username-availability check while the User is typing (issue #14)
      description: >-
        Advisory only, ahead of a full form submit — PATCH /me is still the
        source of truth and re-validates on save. Excludes the caller's own
        current username, so keeping it never reads as taken.
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/avatar:
    post:
      tags: [Auth]
      summary: Upload a real profile photo (issue #14), replacing the client's blob:-URL workaround
      description: >-
        Reuses the on-disk storage and static-serving approach already used by
        listing images. JPEG/PNG/WEBP only, 2 MB cap.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded — same shape as /auth/me, with the new avatarUrl already applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/stats:
    get:
      tags: [Auth]
      summary: The current User's own activity counts, for the profile page's My Statistics card (issue #13)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enquiries, reviews, favorites, listings]
                properties:
                  enquiries: { type: integer }
                  reviews: { type: integer }
                  favorites: { type: integer }
                  listings:
                    type: integer
                    description: Listings across all Businesses this User owns — 0 for a non-owner, not omitted.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/password:
    post:
      tags: [Auth]
      summary: Change (or, for a Google-only account, set a first) password while signed in — issue #13
      description: >-
        Distinct from the forgot-password email/token flow, which is
        unchanged. currentPassword is required and verified when the account
        already has one; for a Google-only account (hasPassword: false on
        CurrentUser) it's ignored, since there's nothing to verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Password changed }
        '401': { description: Not signed in, or currentPassword missing/incorrect when one is required }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current session
      responses:
        '204': { description: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current session's User, with roles and effective permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # Phase 6: not in the original Phase 0.5 contract — POST /users/{userId}/impersonate
  # starts a session but nothing stops it. Self-scoped: exits whatever
  # impersonation session the caller is currently on.
  /auth/exit-impersonation:
    post:
      tags: [Auth]
      summary: Exit an active impersonation session, restoring the admin's own session (FR160)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      security: []
      summary: Send a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202': { description: Reset email queued if the account exists }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Password updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ===========================================================================
  # Taxonomies (Super Admin write, public read)
  # ===========================================================================
  /categories:
    get:
      tags: [Taxonomies]
      security: []
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Taxonomies]
      summary: Create a category (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [Taxonomies]
      summary: Update a category (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [Taxonomies]
      summary: Delete a category (Super Admin; blocked while Listings reference it — ADR 0009)
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{categoryId}/attributes:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Taxonomies]
      security: []
      summary: List a category's dynamic attribute definitions (ADR 0004)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryAttribute' }
    post:
      tags: [Taxonomies]
      summary: Add a dynamic attribute to a category (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryAttributeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryAttribute' }

  /categories/{categoryId}/attributes/{attributeId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
      - name: attributeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update a category's dynamic attribute definition (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryAttributeInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryAttribute' }
    delete:
      tags: [Taxonomies]
      summary: Remove a dynamic attribute definition (Super Admin); Listings' stored values for it are removed via cascade
      responses:
        '204': { description: Deleted }

  /locations:
    get:
      tags: [Taxonomies]
      security: []
      summary: List locations (flat, Yercaud-only — CONTEXT.md)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedLookup' }
    post:
      tags: [Taxonomies]
      summary: Create a location (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedLookup' }

  /locations/{locationId}:
    parameters:
      - name: locationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update a location (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedLookup' }
    delete:
      tags: [Taxonomies]
      summary: Delete a location (Super Admin); Listings referencing it have location_id set to null (ADR 0009)
      responses:
        '204': { description: Deleted }

  /amenities:
    get:
      tags: [Taxonomies]
      security: []
      summary: List amenities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedLookup' }
    post:
      tags: [Taxonomies]
      summary: Create an amenity (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '201': { description: Created }

  /attribute-tags:
    get:
      tags: [Taxonomies]
      security: []
      summary: List attribute tags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedLookup' }
    post:
      tags: [Taxonomies]
      summary: Create an attribute tag (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '201': { description: Created }

  /attribute-tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update an attribute tag (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Taxonomies]
      summary: Delete an attribute tag (Super Admin); removed from any Listings via cascade
      responses:
        '204': { description: Deleted }

  /property-types:
    get:
      tags: [Taxonomies]
      security: []
      summary: List Hotel property types
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedLookup' }
    post:
      tags: [Taxonomies]
      summary: Create a property type (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '201': { description: Created }

  /property-types/{propertyTypeId}:
    parameters:
      - name: propertyTypeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update a property type (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Taxonomies]
      summary: Delete a property type (Super Admin); Hotel details referencing it have property_type_id set to null (ADR 0009)
      responses:
        '204': { description: Deleted }

  /languages:
    get:
      tags: [Taxonomies]
      security: []
      summary: List spoken languages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedLookup' }
    post:
      tags: [Taxonomies]
      summary: Create a language (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '201': { description: Created }

  /languages/{languageId}:
    parameters:
      - name: languageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update a language (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedLookupInput' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Taxonomies]
      summary: Delete a language (Super Admin); removed from any Hotel/Tour listings via cascade
      responses:
        '204': { description: Deleted }

  /badges:
    get:
      tags: [Taxonomies]
      security: []
      summary: List promotional badges (public — the directory styles badges from this)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Badge' }
    post:
      tags: [Taxonomies]
      summary: Create a badge (Super Admin — guarded by Categories, like every other master taxonomy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BadgeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Badge' }

  /badges/{badgeId}:
    parameters:
      - name: badgeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update a badge (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BadgeInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Badge' }
    delete:
      tags: [Taxonomies]
      summary: Delete a badge (Super Admin) — Listings wearing it keep it as null, not deleted
      responses:
        '204': { description: Deleted }

  /price-bands:
    get:
      tags: [Taxonomies]
      security: []
      summary: List price bands
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PriceBand' }
    post:
      tags: [Taxonomies]
      summary: Create a price band (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceBand' }
      responses:
        '201': { description: Created }

  /price-bands/{priceBandId}:
    parameters:
      - name: priceBandId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Taxonomies]
      summary: Update a price band (Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceBand' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Taxonomies]
      summary: Delete a price band (Super Admin)
      responses:
        '204': { description: Deleted }

  # ===========================================================================
  # Businesses
  # ===========================================================================
  /businesses:
    get:
      tags: [Businesses]
      summary: List businesses (Super Admin sees all; Business Owner sees own)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Business' }
    post:
      tags: [Businesses]
      summary: Apply as a Business Owner (FR161) — starts as 'pending'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessInput' }
      responses:
        '201':
          description: Created, pending Super Admin approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }

  /businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Businesses]
      security: []
      summary: Get a Business — public once approved, owner/admin only before that
      description: >-
        An approved Business is readable by anyone: the public Listing page shows
        its address, email and social links, and a directory whose businesses
        can't be read is not a directory. (Phone and website were already public,
        riding along on ListingSummary — the old rule wasn't self-consistent.)

        Anything not yet approved keeps the previous rule exactly: 401 when not
        signed in, 403 when signed in without ownership or Businesses:view. Not
        404 — Phase 1 chose that distinction deliberately, and Business ids are
        UUIDs, so the enumeration argument that justifies 404 for Listings
        doesn't apply.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Businesses]
      summary: Update a business (owner or Super Admin) — applies immediately, ADR 0005
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }

  /businesses/{businessId}/approve:
    parameters: [{ $ref: '#/components/parameters/BusinessId' }]
    post:
      tags: [Businesses]
      summary: Approve a pending business (Super Admin)
      responses:
        '200': { description: Approved }

  /businesses/{businessId}/reject:
    parameters: [{ $ref: '#/components/parameters/BusinessId' }]
    post:
      tags: [Businesses]
      summary: Reject a pending business (Super Admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        '200': { description: Rejected }

  /businesses/{businessId}/suspend:
    parameters: [{ $ref: '#/components/parameters/BusinessId' }]
    post:
      tags: [Businesses]
      summary: Suspend a business for policy violation (Super Admin)
      responses:
        '200': { description: Suspended }

  /businesses/{businessId}/archive:
    parameters: [{ $ref: '#/components/parameters/BusinessId' }]
    post:
      tags: [Businesses]
      summary: Archive a business — history kept, hidden from public site (ADR 0010)
      responses:
        '200': { description: Archived }

  /businesses/{businessId}/staff:
    parameters: [{ $ref: '#/components/parameters/BusinessId' }]
    get:
      tags: [Businesses]
      summary: List staff invited to this business (FR163)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusinessStaff' }
    post:
      tags: [Businesses]
      summary: Invite a staff member (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                permissions:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '201': { description: Invited }

  /businesses/{businessId}/staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: staffId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Businesses]
      summary: Update a staff member's permissions or status (owner)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, accepted, revoked] }
                permissions:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Businesses]
      summary: Revoke a staff member (owner)
      responses:
        '204': { description: Revoked }

  # ===========================================================================
  # Search
  # ===========================================================================
  /search:
    get:
      tags: [Search]
      security: []
      summary: Hybrid search over Listings and Businesses (issue #11)
      description: >-
        The public directory search. Fuses a lexical leg (weighted full-text with
        typo/prefix tolerance) and a semantic leg (embedding similarity) with
        Reciprocal Rank Fusion. Results are grouped, Listings primary — a visitor
        lands on a Listing they can enquire about, with the owning Business
        reachable alongside.


        Visibility follows the same rule as GET /listings: anonymous callers see
        only 'approved'; a signed-in Business Owner also sees their own pending
        Listings/Businesses. The semantic leg is best-effort — if embeddings are
        unconfigured or the query embedding can't be produced in time, results
        come back on the lexical leg alone.
      parameters:
        - name: q
          in: query
          required: true
          description: The search phrase. Required — an empty search has no meaning here.
          schema: { type: string, minLength: 1 }
        - name: category
          in: query
          description: >-
            Category slug. Scopes the Listings group to one category (a category
            page's hero box); the Businesses group is unaffected.
          schema: { type: string }
        - name: mode
          in: query
          description: >-
            'quick' runs the lexical leg only — no embedding call — for the
            instant type-ahead dropdown, where per-keystroke latency and cost
            matter. Omit (the default, 'full') for the submitted-search results
            page, which runs the full hybrid ranking.
          schema: { type: string, enum: [full, quick], default: full }
        - name: pageSize
          in: query
          description: Max results per group.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [listings, businesses]
                properties:
                  listings:
                    type: array
                    items: { $ref: '#/components/schemas/ListingSummary' }
                  businesses:
                    type: array
                    items: { $ref: '#/components/schemas/BusinessSummary' }

  # ===========================================================================
  # Listings
  # ===========================================================================
  /listings:
    get:
      tags: [Listings]
      security: []
      summary: Search/browse Listings (public — only 'approved' are visible to anonymous callers)
      parameters:
        - name: q
          in: query
          description: >-
            Free-text search. Shares the lexical leg of the search engine (issue
            #11): weighted full-text with typo/prefix tolerance, ordered by
            relevance rather than recency. (The semantic leg and its Businesses
            group live on GET /search; this stays lexical so browse stays a single
            query.) Combine with the filters below to search within a slice.
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string, description: category slug }
        - name: location
          in: query
          schema: { type: string, description: location slug }
        - name: businessId
          in: query
          description: >-
            Scope to one Business's Listings — the Admin panel's "My Listings"
            view. A UUID, not a slug: the caller already holds the Business row.
            Visibility rules still apply, so a stranger scoping to someone
            else's Business sees only its approved Listings.
          schema: { type: string, format: uuid }
        - name: minRating
          in: query
          schema: { type: number }
        - name: priceBand
          in: query
          description: >-
            Price band label (price_bands has no slug). Matched as a range against
            the Listing's priceFrom, using the band's min/max amounts — there is no
            FK from listings to price_bands. Listings with no price are excluded.
          schema: { type: string }
        - name: minPrice
          in: query
          description: FR21's Price Range filter / FR28's per-night slider. Excludes Listings with no price.
          schema: { type: integer, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: integer, minimum: 0 }
        - name: amenities
          in: query
          description: >-
            Comma-separated amenity names. AND semantics — a Listing must carry
            every named amenity to match.
          schema: { type: string }
        - name: minStarRating
          in: query
          description: hotel_details.star_rating — only Hotel Listings have a row to match against.
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: propertyType
          in: query
          description: Property type name (property_types has no slug), Hotel Listings only.
          schema: { type: string }
        - name: status
          in: query
          description: Admin/owner callers only
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ListingSummary' }
                  total: { type: integer }
    post:
      tags: [Listings]
      summary: Create a Listing under one of the caller's Businesses
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingInput' }
      responses:
        '201':
          description: Created — every new Listing starts pending, gated on its own first-publish approval (ADR 0005)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }

  /listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Listings]
      security: []
      summary: Get a Listing with its category-specific details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update a Listing — applies immediately once first-published (ADR 0005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }

  /listings/by-slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Listings]
      security: []
      summary: Get a Listing by its slug (the public site's URL shape)
      description: >-
        The public site addresses Listings by slug — readable, keyword-bearing,
        and what the server-rendered pages link to. Admin keeps using ids. A
        separate path rather than overloading {listingId}, so a slug that happens
        to look like a UUID is never ambiguous. Same visibility rule as fetching
        by id: an unapproved Listing 404s to anyone but its owner or an admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '404': { $ref: '#/components/responses/NotFound' }

  /listings/{listingId}/badge:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    put:
      tags: [Listings]
      summary: Set or clear a Listing's promotional badge (FR30 — Marketing:edit, i.e. Super Admin)
      description: >-
        Deliberately not a ListingInput field. Badging is a marketing act, and a
        Business Owner self-labelling as "Popular" would make the badge
        meaningless — so the permission states the rule rather than the service
        special-casing a field owners may not write. Pass null to clear.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badgeId]
              properties:
                badgeId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }

  /listings/{listingId}/stats:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    get:
      tags: [Listings]
      summary: A Business Owner's own View/Favorite/Contact-Reveal/Enquiry counts and Featured/Sponsored status (issue #24)
      description: >-
        Owner-or-permission gated, same as every other owner-scoped Listing
        sub-resource (Listings:edit). Lets an owner see what's actually
        driving (or not driving) their Listing's Featured eligibility (#17,
        #19) without exposing it to anyone else.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /listings/{listingId}/approve:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
